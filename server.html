<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dump Center — Server</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="/nav.css">
    <script src="/config.js"></script>
    <script src="/i18n.js?v=5"></script>
    <script src="/app.js?v=5"></script>
    <style>
        :root {
            --white:   #ffffff;
            --bg:      #0a0a0a;
            --surface: #111111;
            --surface2:#181818;
            --border:  #242424;
            --border2: #2e2e2e;
            --text:    #f5f5f5;
            --muted:   #888888;
            --muted2:  #555555;
            --accent:  #22c55e;
            --accent-low: rgba(34,197,94,0.10);
            --accent-glow: rgba(34,197,94,0.25);
            --red:     #ef4444;
            --red-low: rgba(239,68,68,0.10);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Inter', system-ui, sans-serif; font-size: 15px;
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; }
        .wrap { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* NAV */
        nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10,10,10,0.95); border-bottom: 1px solid var(--border);
            backdrop-filter: blur(16px);
        }
        .nav-inner { height: 56px; display: flex; align-items: center; justify-content: space-between; }
        .nav-logo { display: flex; align-items: center; gap: 10px; }
        .nav-logo-mark {
            width: 28px; height: 28px; border-radius: 6px; background: var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 900; color: #000;
        }
        .nav-logo-text { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; color: var(--white); }
        .nav-logo-text span { color: var(--accent); }
        .nav-sub { font-size: 11px; color: var(--muted2); font-family: 'JetBrains Mono', monospace; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }

        /* BUTTONS */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            padding: 9px 16px; border-radius: 8px; cursor: pointer; border: none;
            font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
            transition: all 120ms ease; white-space: nowrap;
        }
        .btn-ghost { background: var(--surface); border: 1px solid var(--border2); color: var(--text); }
        .btn-ghost:hover { background: var(--surface2); border-color: #3a3a3a; }
        .btn-green { background: var(--accent); color: #000; font-weight: 700; }
        .btn-green:hover { background: #16a34a; box-shadow: 0 0 20px var(--accent-glow); }
        .btn-red { background: var(--red-low); border: 1px solid rgba(239,68,68,0.25); color: #f87171; }
        .btn-red:hover { background: rgba(239,68,68,0.18); border-color: rgba(239,68,68,0.4); }
        .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 6px; }
        .btn:disabled { opacity: 0.35; pointer-events: none; }

        /* INPUT */
        .inp {
            width: 100%; border-radius: 8px;
            background: var(--surface2); border: 1px solid var(--border2);
            padding: 10px 13px; color: var(--text); outline: none;
            font-family: 'JetBrains Mono', monospace; font-size: 13px;
            transition: border-color 130ms ease, box-shadow 130ms ease;
        }
        .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,197,94,0.12); }
        .inp::placeholder { color: var(--muted2); }

        /* CARDS */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .card-title { font-size: 14px; font-weight: 600; color: var(--text); }
        .card-body { padding: 20px; }

        /* BADGE */
        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; }
        .badge-green { background: var(--accent-low); color: var(--accent); border: 1px solid rgba(34,197,94,0.22); }
        .badge-dark  { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: lp 2s infinite; }
        @keyframes lp { 0%,100%{opacity:1} 50%{opacity:.3} }

        /* KICKER */
        .kicker { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.10em; }

        /* SERVER HERO */
        .server-hero-name { font-size: clamp(1.8rem, 3.5vw, 2.8rem); font-weight: 900; color: var(--white); letter-spacing: -0.03em; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* RESOURCE TILE */
        .res-tile {
            border-radius: 7px; border: 1px solid var(--border);
            background: var(--surface2); padding: 9px 11px;
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; transition: border-color 120ms ease, background 120ms ease;
            text-align: left; font-family: 'JetBrains Mono', monospace;
            font-size: 12px; color: var(--muted); width: 100%;
        }
        .res-tile:hover { border-color: rgba(34,197,94,0.30); color: var(--text); }
        .res-tile.selected { border-color: rgba(34,197,94,0.55); background: rgba(34,197,94,0.07); color: var(--text); }
        .res-check {
            width: 13px; height: 13px; border-radius: 3px;
            border: 1px solid var(--border2); background: transparent;
            flex-shrink: 0; transition: all 120ms ease; position: relative;
        }
        .res-tile.selected .res-check { background: var(--accent); border-color: var(--accent); }
        .res-tile.selected .res-check::after {
            content: ''; position: absolute; left: 3px; top: 1px;
            width: 5px; height: 8px; border: 2px solid #000;
            border-top: none; border-left: none; transform: rotate(45deg);
        }
        .res-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

        /* STAT PILL */
        .stat-pill { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 10px 14px; }
        .stat-pill-label { font-size: 10px; font-weight: 600; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.06em; }
        .stat-pill-val { font-size: 16px; font-weight: 700; color: var(--white); margin-top: 3px; }

        /* CONSOLE */
        .console-body {
            padding: 14px 16px; background: #070710;
            font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6;
            overflow-y: auto;
        }
        .console-body::-webkit-scrollbar { width: 4px; }
        .console-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

        @keyframes fadeUp { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
        .fu { animation: fadeUp .4s ease both; }
        .lang-select { background: var(--surface); color: var(--text); border: 1px solid var(--border2); border-radius: 8px; padding: 7px 10px; font-size: 12px; }

        @media(max-width:860px){
            .main-grid { grid-template-columns: 1fr !important; }
            .action-row { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav>
        <div class="wrap nav-inner">
            <div style="display:flex;align-items:center;gap:12px;">
                <a href="/panel" class="btn btn-ghost btn-sm">← Panel</a>
                <div>
                    <a href="/" class="nav-logo" style="text-decoration:none;">
                        <div class="nav-logo-mark">DC</div>
                        <div class="nav-logo-text">Dump<span>Center</span></div>
                    </a>
                    <div class="nav-sub" id="nav-server-name">Loading...</div>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <select id="lang-select" class="lang-select" aria-label="Language">
                    <option value="nl">Nederlands</option>
                    <option value="en">English</option>
                </select>
                <div id="user-menu"></div>
            </div>
        </div>
    </nav>

    <main class="wrap" style="padding:36px 0 64px;">

        <!-- SERVER HERO CARD -->
        <div class="card fu" style="margin-bottom:14px;">
            <div style="padding:28px 28px 24px;">
                <div class="badge badge-green" style="margin-bottom:16px;">
                    <span class="live-dot"></span>
                    Target
                </div>
                <div class="server-hero-name" id="server-name">...</div>
                <div class="mono" id="server-ip" style="font-size:13px;color:var(--muted);margin-top:8px;word-break:break-all;"></div>
                <div class="mono" id="server-id" style="font-size:11px;color:var(--muted2);margin-top:3px;word-break:break-all;"></div>

                <!-- ACTIONS -->
                <div class="action-row" style="display:flex;gap:9px;margin-top:20px;align-items:center;flex-wrap:wrap;">
                    <button class="btn btn-green" id="btn-extract">Extract</button>
                    <button class="btn btn-green" id="btn-download" disabled>Download (0)</button>
                    <button class="btn btn-red" id="btn-stop" style="display:none;">Stop</button>
                    <button class="btn btn-ghost btn-sm" id="btn-clear">Clear</button>
                    <!-- MINI STATS -->
                    <div style="display:flex;gap:8px;margin-left:auto;">
                        <div class="stat-pill"><div class="stat-pill-label">Resources</div><div class="stat-pill-val" id="stat-res">0</div></div>
                        <div class="stat-pill"><div class="stat-pill-label">Selected</div><div class="stat-pill-val" id="stat-sel">0</div></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MAIN GRID -->
        <div class="main-grid" style="display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start;">

            <!-- RESOURCES -->
            <div class="card fu">
                <div class="card-header">
                    <div>
                        <div class="kicker">Resources</div>
                        <div class="card-title" style="margin-top:3px;">Selection</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:7px;">
                        <button class="btn btn-ghost btn-sm" id="btn-all">All</button>
                        <button class="btn btn-ghost btn-sm" id="btn-none">None</button>
                        <div class="badge badge-dark" id="res-counter">0 / 0</div>
                    </div>
                </div>
                <div style="padding:14px 16px;border-bottom:1px solid var(--border);">
                    <input type="text" class="inp" id="search-inp" placeholder="Search a resource..." />
                </div>
                <div class="card-body" style="padding:14px;">
                    <div id="res-empty" style="padding:48px;text-align:center;color:var(--muted2);font-size:13px;" class="mono">
                        No resources. Click Extract.
                    </div>
                    <div id="res-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:520px;overflow-y:auto;display:none;">
                    </div>
                </div>
            </div>

            <!-- CONSOLE -->
            <div class="card fu" style="overflow:hidden;">
                <div class="card-header">
                    <div>
                        <div class="kicker">Console</div>
                        <div class="card-title" style="margin-top:3px;">Logs</div>
                    </div>
                    <div class="badge badge-dark" id="log-count">0 lines</div>
                </div>
                <div class="console-body" id="console-box" style="height:700px;">
                    <span style="color:var(--muted2);">Waiting...</span>
                </div>
            </div>

        </div>
    </main>

<script>
    const socket = io();

    let server    = { name: '...', ip: '...', id: '...' };
    let resources = [];
    let selected  = new Set();
    let dumping   = false;
    let logCount  = 0;
    let firstLog  = true;

    const consoleBox   = document.getElementById('console-box');
    const resGrid      = document.getElementById('res-grid');
    const resEmpty     = document.getElementById('res-empty');
    const searchInp    = document.getElementById('search-inp');
    const btnDownload  = document.getElementById('btn-download');
    const btnStop      = document.getElementById('btn-stop');
    const btnExtract   = document.getElementById('btn-extract');

    // ── LOG ──
    function addLog(html, type = 'info') {
        if (firstLog) { consoleBox.innerHTML = ''; firstLog = false; }
        const now = new Date().toLocaleTimeString('en-GB', { hour12: false });
        const cls = { ok:'color:#22c55e', err:'color:#f87171', info:'color:#60a5fa', warn:'color:#fbbf24' }[type] || 'color:#60a5fa';
        const div = document.createElement('div');
        div.style.marginBottom = '5px';
        div.innerHTML = `<span style="color:var(--muted2);margin-right:8px;">[${now}]</span><span style="${cls}">${html}</span>`;
        consoleBox.appendChild(div);
        consoleBox.scrollTop = consoleBox.scrollHeight;
        logCount++;
        document.getElementById('log-count').textContent = logCount + ' lines';
    }

    // ── SOCKET ──
    socket.on('connect', () => addLog('[SOCKET] Connected to backend.', 'ok'));
    socket.on('log', d => addLog(d.data, 'info'));
    socket.on('resources_found', data => {
        dumping = false;
        btnExtract.disabled = false;
        btnStop.style.display = 'none';
        resources = data;
        selected = new Set(data.map(r => r.name || r));
        renderResources();
        addLog(`[OK] ${data.length} resources found.`, 'ok');
    });
    socket.on('download_completed', stats => {
        dumping = false;
        btnExtract.disabled = false;
        btnStop.style.display = 'none';
        btnDownload.disabled = (selected.size === 0);
        addLog(`[DONE] Requested: ${stats.requested} · Completed: ${stats.completed} · Failed: ${stats.failed}`, 'ok');
        if (stats.stopped) addLog('Download interrupted.', 'warn');
    });

    // ── RENDER RESOURCES ──
    function renderResources() {
        const q = searchInp.value.toLowerCase();
        const filtered = q ? resources.filter(r => (r.name||r).toLowerCase().includes(q)) : resources;

        document.getElementById('stat-res').textContent = resources.length;
        document.getElementById('stat-sel').textContent = selected.size;
        document.getElementById('res-counter').textContent = selected.size + ' / ' + resources.length;
        btnDownload.textContent = `Download (${selected.size})`;
        btnDownload.disabled = (selected.size === 0 || dumping);

        if (resources.length === 0) { resEmpty.style.display = ''; resGrid.style.display = 'none'; return; }
        resEmpty.style.display = 'none';
        resGrid.style.display = 'grid';
        resGrid.innerHTML = '';

        if (filtered.length === 0) {
            resGrid.style.display = 'none';
            resEmpty.style.display = '';
            resEmpty.textContent = `No results for "${searchInp.value}"`;
            return;
        }

        filtered.forEach(res => {
            const name = res.name || res;
            const tile = document.createElement('button');
            tile.type = 'button';
            tile.className = 'res-tile' + (selected.has(name) ? ' selected' : '');
            tile.innerHTML = `<div class="res-check"></div><span class="res-label">${name}</span>`;
            tile.onclick = () => {
                if (selected.has(name)) selected.delete(name); else selected.add(name);
                renderResources();
            };
            resGrid.appendChild(tile);
        });
    }

    searchInp.addEventListener('input', renderResources);

    document.getElementById('btn-all').onclick = () => {
        const q = searchInp.value.toLowerCase();
        const filtered = q ? resources.filter(r => (r.name||r).toLowerCase().includes(q)) : resources;
        filtered.forEach(r => selected.add(r.name || r));
        renderResources();
    };
    document.getElementById('btn-none').onclick = () => { selected.clear(); renderResources(); };

    btnExtract.onclick = () => {
        if (!server.ip || dumping) return;
        dumping = true;
        btnExtract.disabled = true;
        btnStop.style.display = 'inline-flex';
        resources = []; selected.clear();
        renderResources();
        addLog(`>> Fetching resources: ${server.name} (${server.ip})`, 'warn');
        socket.emit('start_dump', { target: server.ip, label: server.name });
    };

    btnDownload.onclick = () => {
        if (!selected.size) return;
        dumping = true;
        btnDownload.disabled = true;
        btnStop.style.display = 'inline-flex';
        addLog(`>> Downloading ${selected.size} resources...`, 'warn');
        socket.emit('download_resources', { resources: [...selected] });
    };

    btnStop.onclick = () => {
        socket.emit('stop_download');
        addLog('>> Stop requested.', 'warn');
    };

    document.getElementById('btn-clear').onclick = () => { consoleBox.innerHTML = ''; logCount = 0; firstLog = true; document.getElementById('log-count').textContent = '0 lines'; };

    // ── FETCH SERVER ──
    async function fetchServer() {
        const parts = window.location.pathname.split('/');
        const id = parts[parts.length - 1];
        try {
            const res = await fetch('/api/servers');
            const payload = await res.json();
            const list = Array.isArray(payload) ? payload : (payload.servers || []);
            const found = Array.isArray(list) ? list.find(s => s.id === id) : null;
            if (found) {
                server = found;
                document.getElementById('server-name').textContent = found.name;
                document.getElementById('server-ip').textContent   = found.ip;
                document.getElementById('server-id').textContent   = found.id;
                document.getElementById('nav-server-name').textContent = found.name;
                document.title = `Dump Center — ${found.name}`;
            } else {
                document.getElementById('server-name').textContent = 'Server not found';
            }
        } catch {}
    }

    fetchServer();
    DumpCenterApp.initPage({ userMenuId: 'user-menu' });
</script>
</body>
</html>
