<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dump Center — Inloggen...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="/config.js"></script>
    <script src="/i18n.js?v=5"></script>
    <script src="/app.js?v=5"></script>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0a0a0a; color:#f5f5f5; font-family:Inter,system-ui,sans-serif; }
        .box { text-align:center; padding:32px; }
        .spin { width:32px; height:32px; border:3px solid #242424; border-top-color:#22c55e; border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 16px; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="spin"></div>
        <p id="msg">Inloggen...</p>
    </div>
<script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get('data');
        const msg = document.getElementById('msg');

        if (!raw) {
            msg.textContent = 'Geen login data ontvangen.';
            setTimeout(() => { window.location.href = '/login.html'; }, 2000);
            return;
        }

        try {
            const pad = raw.length % 4 ? '='.repeat(4 - (raw.length % 4)) : '';
            const json = atob(raw.replace(/-/g, '+').replace(/_/g, '/') + pad);
            const data = JSON.parse(json);
            if (data && data.user) {
                DumpCenterApp.saveSession(data);
                window.location.replace('/');
                return;
            }
        } catch (e) {}

        msg.textContent = 'Login mislukt. Probeer opnieuw.';
        setTimeout(() => { window.location.href = '/login.html'; }, 2500);
    })();
</script>
</body>
</html>
