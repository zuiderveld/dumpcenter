<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dump Center — Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="/i18n.js?v=4"></script>
    <script src="/app.js?v=4"></script>
    <style>
        :root {
            --white:   #ffffff;
            --bg:      #0a0a0a;
            --surface: #111111;
            --surface2:#181818;
            --border:  #242424;
            --border2: #2e2e2e;
            --text:    #f5f5f5;
            --muted:   #888888;
            --muted2:  #555555;
            --accent:  #22c55e;
            --accent-low: rgba(34,197,94,0.10);
            --accent-glow: rgba(34,197,94,0.25);
            --red:     #ef4444;
            --red-low: rgba(239,68,68,0.10);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Inter', system-ui, sans-serif; font-size: 15px;
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; }
        .wrap { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* NAV */
        nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10,10,10,0.95); border-bottom: 1px solid var(--border);
            backdrop-filter: blur(16px);
        }
        .nav-inner { height: 56px; display: flex; align-items: center; justify-content: space-between; }
        .nav-logo { display: flex; align-items: center; gap: 10px; }
        .nav-logo-mark {
            width: 28px; height: 28px; border-radius: 6px; background: var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 900; color: #000;
        }
        .nav-logo-text { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; color: var(--white); }
        .nav-logo-text span { color: var(--accent); }
        .nav-sub { font-size: 11px; color: var(--muted2); font-family: 'JetBrains Mono', monospace; margin-top: 1px; }

        /* BUTTONS */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            padding: 9px 16px; border-radius: 8px; cursor: pointer; border: none;
            font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
            transition: all 120ms ease; white-space: nowrap;
        }
        .btn-ghost { background: var(--surface); border: 1px solid var(--border2); color: var(--text); }
        .btn-ghost:hover { background: var(--surface2); border-color: #3a3a3a; }
        .btn-green { background: var(--accent); color: #000; font-weight: 700; }
        .btn-green:hover { background: #16a34a; box-shadow: 0 0 20px var(--accent-glow); }
        .btn-red { background: var(--red-low); border: 1px solid rgba(239,68,68,0.25); color: #f87171; }
        .btn-red:hover { background: rgba(239,68,68,0.18); border-color: rgba(239,68,68,0.4); }
        .btn-outline { background: transparent; border: 1px solid var(--border2); color: var(--muted); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 6px; }
        .btn-full { width: 100%; display: flex; justify-content: center; }
        .btn:disabled { opacity: 0.35; pointer-events: none; }

        /* INPUT */
        .inp {
            width: 100%; border-radius: 8px;
            background: var(--surface2); border: 1px solid var(--border2);
            padding: 10px 13px; color: var(--text); outline: none;
            font-family: 'JetBrains Mono', monospace; font-size: 13px;
            transition: border-color 130ms ease, box-shadow 130ms ease;
        }
        .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,197,94,0.12); }
        .inp::placeholder { color: var(--muted2); }

        /* LABEL */
        .lbl { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 7px; }

        /* CARDS */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .card-title { font-size: 14px; font-weight: 600; color: var(--text); }
        .card-sub { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
        .card-body { padding: 20px; }

        /* BADGE */
        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; }
        .badge-green { background: var(--accent-low); color: var(--accent); border: 1px solid rgba(34,197,94,0.22); }
        .badge-dark  { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
        .badge-red   { background: var(--red-low); color: #f87171; border: 1px solid rgba(239,68,68,0.22); }

        /* TARGET ROW */
        .target-row {
            background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
            padding: 13px 15px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
            transition: border-color 130ms ease;
        }
        .target-row:hover { border-color: rgba(34,197,94,0.25); }
        .t-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
        .t-name { font-size: 13px; font-weight: 600; color: var(--white); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .t-ip { font-size: 11px; color: var(--muted2); font-family: 'JetBrains Mono', monospace; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* CONSOLE */
        .console-body {
            padding: 14px 16px; background: #070710; font-family: 'JetBrains Mono', monospace;
            font-size: 12px; line-height: 1.6; overflow-y: auto; height: 220px;
        }
        .console-body::-webkit-scrollbar { width: 4px; }
        .console-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
        .log-time { color: var(--muted2); margin-right: 8px; }
        .log-ok   { color: var(--accent); }
        .log-err  { color: #f87171; }
        .log-info { color: #60a5fa; }
        .log-warn { color: #fbbf24; }

        /* FORM GROUP */
        .form-group { margin-bottom: 14px; }
        .form-group:last-of-type { margin-bottom: 0; }

        /* SECTION KICKER */
        .kicker { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.10em; }
        .lang-select { background: var(--surface); color: var(--text); border: 1px solid var(--border2); border-radius: 8px; padding: 7px 10px; font-size: 12px; }

        @keyframes fadeUp { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
        .fu { animation: fadeUp .4s ease both; }

        @media(max-width:860px){
            .panel-grid { grid-template-columns:1fr !important; }
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav>
        <div class="wrap nav-inner">
            <div style="display:flex;align-items:center;gap:12px;">
                <a href="/" class="btn btn-ghost btn-sm">← Home</a>
                <div>
                    <a href="/" class="nav-logo" style="text-decoration:none;">
                        <div class="nav-logo-mark">DC</div>
                        <div class="nav-logo-text">Dump<span>Center</span></div>
                    </a>
                    <div class="nav-sub">Workspace · Panel</div>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <select id="lang-select" class="lang-select" aria-label="Language">
                    <option value="nl">Nederlands</option>
                    <option value="en">English</option>
                </select>
                <div id="user-menu"></div>
                <button class="btn btn-ghost btn-sm" id="btn-unpacked" data-i18n="common_open_unpacked">Open Unpacked</button>
            </div>
        </div>
    </nav>

    <main class="wrap" style="padding:36px 0 64px;">

        <!-- PAGE TITLE -->
        <div style="margin-bottom:24px;" class="fu">
            <div class="kicker" data-i18n="panel_title">Panel</div>
            <h1 style="font-size:26px;font-weight:800;color:var(--white);margin-top:4px;letter-spacing:-0.02em;" data-i18n="panel_subtitle">Werkruimte</h1>
        </div>

        <div id="license-banner" class="card fu" style="display:none;margin-bottom:14px;">
            <div class="card-body" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
                <div>
                    <div class="kicker" data-i18n="license_title">License</div>
                    <div id="license-label" style="font-size:15px;font-weight:700;margin-top:4px;">—</div>
                </div>
                <div class="badge badge-dark" id="license-usage">0 / 0</div>
            </div>
        </div>

        <!-- MAIN GRID -->
        <div class="panel-grid" style="display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start;">

            <!-- LEFT COLUMN -->
            <div style="display:flex;flex-direction:column;gap:12px;">

                <!-- ADD TARGET -->
                <div class="card fu">
                    <div class="card-header">
                        <div>
                            <div class="kicker">Registry</div>
                            <div class="card-title" style="margin-top:3px;">New Target</div>
                        </div>
                        <div class="badge badge-green">Add</div>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label class="lbl">Name</label>
                            <input type="text" class="inp" id="inp-name" placeholder="My Server" />
                        </div>
                        <div class="form-group">
                            <label class="lbl">IP / CFX</label>
                            <input type="text" class="inp" id="inp-ip" placeholder="cfx.re/join/xxxxxx" />
                        </div>
                        <button class="btn btn-green btn-full" id="btn-add" style="margin-top:14px;">Save Target</button>
                    </div>
                </div>

                <!-- RESOLVE CFX -->
                <div class="card fu">
                    <div class="card-header">
                        <div class="card-title">Resolve CFX / URL</div>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <input type="text" class="inp" id="inp-resolver" placeholder="cfx.re/join/qeakk9" />
                        </div>
                        <div style="display:flex;gap:8px;margin-top:10px;">
                            <button class="btn btn-green" style="flex:1;" id="btn-resolve">Resolve</button>
                            <button class="btn btn-outline" style="flex:1;" id="btn-use-resolved" disabled>Use</button>
                        </div>
                        <div class="mono" id="resolved-display" style="margin-top:10px;font-size:12px;color:var(--accent);word-break:break-all;display:none;"></div>
                    </div>
                </div>

                <!-- SCANNER -->
                <button class="btn btn-green btn-full" id="btn-scanner" style="padding:12px;font-size:13px;">
                    ▶ Start Scanner
                </button>

            </div>

            <!-- RIGHT: TARGETS -->
            <div class="card fu" style="overflow:visible;">
                <div class="card-header">
                    <div>
                        <div class="kicker">Registry</div>
                        <div class="card-title" style="margin-top:3px;">Targets</div>
                    </div>
                    <div class="badge badge-dark" id="targets-count">0 total</div>
                </div>
                <div id="targets-list" style="padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px;max-height:500px;overflow-y:auto;">
                    <div id="no-targets-msg" style="padding:48px 20px;text-align:center;color:var(--muted2);font-size:13px;" class="mono">
                        No targets yet. Add your first one.
                    </div>
                </div>
            </div>

        </div>

        <!-- CONSOLE -->
        <div class="card" style="margin-top:14px;">
            <div class="card-header">
                <div class="card-title">Console</div>
                <button class="btn btn-ghost btn-sm" id="btn-clear-logs">Clear</button>
            </div>
            <div class="console-body" id="console-box">
                <span style="color:var(--muted2);">Waiting...</span>
            </div>
        </div>

    </main>

<script>
    const socket = io();
    let servers = [];
    let license = null;
    let snifferRunning = false;
    let resolvedEndpoint = '';

    const consoleBox   = document.getElementById('console-box');
    const targetsList  = document.getElementById('targets-list');
    const noTargetsMsg = document.getElementById('no-targets-msg');
    const targetsCount = document.getElementById('targets-count');
    let firstLog = true;

    function addLog(html, type = 'info') {
        if (firstLog) { consoleBox.innerHTML = ''; firstLog = false; }
        const now = new Date().toLocaleTimeString('en-GB', { hour12: false });
        const line = document.createElement('div');
        line.style.marginBottom = '4px';
        const cls = { ok:'log-ok', err:'log-err', info:'log-info', warn:'log-warn' }[type] || 'log-info';
        line.innerHTML = `<span class="log-time">[${now}]</span><span class="${cls}">${html}</span>`;
        consoleBox.appendChild(line);
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    socket.on('connect', () => addLog('[SOCKET] Connected to backend.', 'ok'));
    socket.on('log', d => addLog(d.data, 'info'));

    async function fetchServers() {
        try {
            const res = await fetch('/api/servers');
            const data = await res.json();
            servers = Array.isArray(data) ? data : (data.servers || []);
            license = data.license || license;
            updateLicenseBanner();
            renderTargets();
        } catch {}
    }

    function updateLicenseBanner() {
        const banner = document.getElementById('license-banner');
        if (!banner || !license) return;
        banner.style.display = 'block';
        document.getElementById('license-label').textContent = license.license_label || '—';
        const usage = document.getElementById('license-usage');
        usage.textContent = `${license.used_servers || 0} / ${license.max_servers || 0}`;
        usage.className = 'badge ' + (license.can_add_server ? 'badge-green' : 'badge-red');
        const addBtn = document.getElementById('btn-add');
        if (addBtn) addBtn.disabled = !license.can_add_server;
    }

    function licenseErrorMessage(code) {
        const map = {
            license_limit: DumpCenterApp.t('license_limit'),
            license_inactive: DumpCenterApp.t('license_inactive'),
        };
        return map[code] || DumpCenterApp.t('log_save_failed');
    }

    function renderTargets() {
        targetsCount.textContent = servers.length + ' total';
        if (servers.length === 0) {
            targetsList.innerHTML = '';
            targetsList.appendChild(noTargetsMsg);
            return;
        }
        targetsList.innerHTML = '';
        servers.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = 'target-row';
            row.innerHTML = `
                <div class="t-dot"></div>
                <div style="flex:1;min-width:0;">
                    <div class="t-name">${s.name}</div>
                    <div class="t-ip">${s.ip}</div>
                </div>
                <div style="display:flex;gap:7px;flex-shrink:0;">
                    <button class="btn btn-green btn-sm" onclick="goTo('${s.id}')">Open</button>
                    <button class="btn btn-red btn-sm" onclick="deleteServer(${i})">Delete</button>
                </div>
            `;
            targetsList.appendChild(row);
        });
    }

    function goTo(id) { if (id) window.location.href = `/server/${id}`; }

    document.getElementById('btn-add').onclick = async () => {
        const name = document.getElementById('inp-name').value.trim();
        const ip   = document.getElementById('inp-ip').value.trim();
        if (!name || !ip) return;
        try {
            const res = await fetch('/api/servers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, ip }),
            });
            const data = await res.json().catch(() => null);
            if (!res.ok || !data || data.status !== 'ok') {
                const msg = data && data.message ? licenseErrorMessage(data.message) : DumpCenterApp.t('log_save_failed');
                addLog(`[ERR] ${msg}`, 'err');
                return;
            }
            servers.push(data.server);
            await fetchServers();
            document.getElementById('inp-name').value = '';
            document.getElementById('inp-ip').value = '';
            addLog(`[OK] Target added: ${data.server.name}`, 'ok');
        } catch (e) { addLog(`[ERR] ${e}`, 'err'); }
    };

    document.getElementById('btn-resolve').onclick = async () => {
        const target = document.getElementById('inp-resolver').value.trim();
        if (!target) return;
        resolvedEndpoint = '';
        document.getElementById('btn-use-resolved').disabled = true;
        document.getElementById('resolved-display').style.display = 'none';
        try {
            const res = await fetch('/api/resolve_target', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target }),
            });
            const data = await res.json().catch(() => null);
            if (!res.ok || !data || data.status !== 'ok' || !data.endpoint) {
                addLog('[ERR] Unable to resolve this identifier.', 'err'); return;
            }
            resolvedEndpoint = data.endpoint;
            const disp = document.getElementById('resolved-display');
            disp.textContent = data.endpoint;
            disp.style.display = 'block';
            document.getElementById('btn-use-resolved').disabled = false;
            addLog(`[OK] Endpoint found: ${data.endpoint}`, 'ok');
        } catch (e) { addLog(`[ERR] ${e}`, 'err'); }
    };

    document.getElementById('btn-use-resolved').onclick = () => {
        if (resolvedEndpoint) document.getElementById('inp-ip').value = resolvedEndpoint;
    };

    const scannerBtn = document.getElementById('btn-scanner');
    scannerBtn.onclick = () => {
        snifferRunning = !snifferRunning;
        if (snifferRunning) {
            scannerBtn.textContent = '■ Stop Scanner';
            scannerBtn.className = 'btn btn-red btn-full';
            scannerBtn.style.padding = '12px';
            scannerBtn.style.fontSize = '13px';
            socket.emit('start_sniff');
            addLog('>> Scanner started...', 'ok');
        } else {
            scannerBtn.textContent = '▶ Start Scanner';
            scannerBtn.className = 'btn btn-green btn-full';
            scannerBtn.style.padding = '12px';
            scannerBtn.style.fontSize = '13px';
            socket.emit('stop_sniff');
            addLog('>> Scanner stopped.', 'warn');
        }
    };

    async function deleteServer(index) {
        const target = servers[index];
        if (!target) return;
        try {
            const res = await fetch('/api/servers', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: target.id, index }),
            });
            if (!res.ok) {
                addLog(`[ERR] ${DumpCenterApp.t('log_delete_failed')}`, 'err');
                return;
            }
            await fetchServers();
            addLog(`[INFO] ${DumpCenterApp.t('log_target_deleted')}`, 'warn');
        } catch { addLog(`[ERR] ${DumpCenterApp.t('log_delete_failed')}`, 'err'); }
    }

    document.getElementById('btn-unpacked').onclick = async () => {
        try { await fetch('/api/open_folder', { method: 'POST' }); addLog('[OK] Unpacked folder opened.', 'ok'); }
        catch { addLog('[ERR] Unable to open folder.', 'err'); }
    };

    document.getElementById('btn-clear-logs').onclick = () => {
        consoleBox.innerHTML = '';
        firstLog = true;
    };

    fetchServers();
    DumpCenterApp.initPage({ userMenuId: 'user-menu' });
</script>
</body>
</html>
